[project]
name = "notion-sync"
version = "0.1.1"
description = "Manage your todos through Notion: keeps a local SQLite mirror of your Notion task databases for fast reads, time tracking, and agent-driven task management"
license = "MIT"
requires-python = ">=3.13"
dependencies = [
    "notion-client>=3.1.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.5",
    "pyright>=1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["sync", "scripts"]
omit = [
    "*/__init__.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 90

[tool.ruff]
target-version = "py313"
line-length = 100
# Lint + import sorting across the project; tests included.
include = ["sync/**/*.py", "scripts/**/*.py", "tests/**/*.py"]
exclude = ["scripts/_adhoc.py"]

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "UP", # pyupgrade
    "SIM",  # flake8-simplify
    "C4",   # comprehensions
    "PTH",  # pathlib
]
ignore = [
    "E501",  # line length handled by line-length / formatter
]

[tool.ruff.lint.isort]
known-first-party = ["sync", "create_databases", "notion_cards", "cards"]

[tool.pyright]
pythonVersion = "3.13"
exclude = ["scripts/_adhoc.py"]
# Match the runtime import path (tests put sync/ and scripts/ on sys.path so
# `import sync` resolves to sync/sync.py, not the sync/ package directory).
extraPaths = ["sync", "scripts"]
# Third-party packages without .pyi stubs (notion-client).
reportMissingTypeStubs = false
